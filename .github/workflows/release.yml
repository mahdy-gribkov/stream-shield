name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained binary
        run: >
          dotnet publish src/StreamShield/StreamShield.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -o publish/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamshield-windows-x64
          path: publish/StreamShield.exe

  package-extension:
    name: Package Browser Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension directory
        run: cd extension && zip -r ../streamshield-extension.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamshield-extension
          path: streamshield-extension.zip

  package-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tarball
        run: tar -czf streamshield-linux.tar.gz linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamshield-linux
          path: streamshield-linux.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-windows, package-extension, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/streamshield-windows-x64/StreamShield.exe
            artifacts/streamshield-extension/streamshield-extension.zip
            artifacts/streamshield-linux/streamshield-linux.tar.gz
