<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 260px;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
    }

    .streamshield-popup__header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .streamshield-popup__icon {
      width: 24px;
      height: 24px;
      fill: #059669;
    }

    .streamshield-popup__title {
      font-size: 16px;
      font-weight: 600;
      color: #cdd6f4;
    }

    .streamshield-popup__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid #313244;
    }

    .streamshield-popup__label {
      font-size: 13px;
      color: #a6adc8;
    }

    .streamshield-popup__toggle {
      position: relative;
      width: 40px;
      height: 22px;
      cursor: pointer;
    }

    .streamshield-popup__toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .streamshield-popup__slider {
      position: absolute;
      inset: 0;
      background: #45475a;
      border-radius: 11px;
      transition: background 0.2s ease;
    }

    .streamshield-popup__slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #cdd6f4;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .streamshield-popup__toggle input:checked + .streamshield-popup__slider {
      background: #059669;
    }

    .streamshield-popup__toggle input:checked + .streamshield-popup__slider::before {
      transform: translateX(18px);
    }

    .streamshield-popup__count {
      text-align: center;
      padding: 12px 0 4px;
      color: #a6adc8;
      font-size: 12px;
    }

    .streamshield-popup__count-number {
      font-size: 22px;
      font-weight: 700;
      color: #059669;
      display: block;
      margin-bottom: 2px;
    }

    .streamshield-popup__status {
      text-align: center;
      font-size: 11px;
      color: #585b70;
      padding-top: 8px;
      border-top: 1px solid #313244;
    }
  </style>
</head>
<body>
  <div class="streamshield-popup__header">
    <svg class="streamshield-popup__icon" viewBox="0 0 24 24">
      <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
    </svg>
    <span class="streamshield-popup__title">StreamShield</span>
  </div>

  <div class="streamshield-popup__row">
    <span class="streamshield-popup__label">Protection</span>
    <label class="streamshield-popup__toggle">
      <input type="checkbox" id="toggle" checked>
      <span class="streamshield-popup__slider"></span>
    </label>
  </div>

  <div class="streamshield-popup__count">
    <span class="streamshield-popup__count-number" id="count">0</span>
    fields protected on this page
  </div>

  <div class="streamshield-popup__status" id="status">Active</div>

  <script src="popup.js"></script>
</body>
</html>
